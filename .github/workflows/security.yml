name: Security lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run security regression tests
        run: python -m unittest discover -s tests -v
      - name: Run Ruff
        run: ruff check app.py tests
      - name: Run Bandit
        run: bandit -q -r app.py

  supply-chain:
    name: Dependencies and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install security tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Generate CycloneDX SBOM
        run: python -m cyclonedx_py requirements requirements.txt --output-file sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build non-root image
        run: docker build --tag appsec-lab:${{ github.sha }} .

  codeql:
    name: CodeQL Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyse and upload findings
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
