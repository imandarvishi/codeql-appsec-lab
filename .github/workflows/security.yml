name: Security lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application and security behaviour
        run: python -m unittest discover -s tests -v

  codeql:
    name: CodeQL Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job deliberately runs independently of the failing baseline tests.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyse and upload findings
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python
