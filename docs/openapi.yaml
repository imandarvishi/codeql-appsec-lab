openapi: 3.1.0
info:
  title: CodeQL AppSec Lab API
  version: 2.0.0
  description: Synthetic educational API; not intended for deployment.
paths:
  /health:
    get:
      responses:
        '200': {description: Healthy}
  /campaigns:
    get:
      parameters:
        - in: query
          name: name
          schema: {type: string, maxLength: 80}
      responses:
        '200': {description: Matching synthetic campaigns}
        '400': {description: Invalid input}
  /campaigns/{campaign_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: campaign_id
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200': {description: Campaign in caller tenant}
        '401': {description: Missing, invalid or expired token}
        '404': {description: Resource absent or outside caller tenant}
  /admin/audit-events:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Security audit events}
        '403': {description: security_admin role required}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed-lab-token
